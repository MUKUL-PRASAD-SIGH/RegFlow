# Prometheus stub for RegGraph AI v2 monitoring.
# Start with: docker run -p 9090:9090 -v $(pwd)/monitoring/prometheus:/etc/prometheus prom/prometheus
#
# Wire Grafana to http://prometheus:9090 after adding a prometheus service to compose.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: reggraph-metrics
    static_configs:
      - targets:
          - host.docker.internal:9091
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
